# Device settings for build.sh. Other Wonderful kernels only need their own
# copy of this file (plus wonderful/anykernel.sh) to reuse the build tools.

DEVICE="a23xq"
DEVICE_NAME="Samsung Galaxy A23 5G"
DEFCONFIG="wonderful_defconfig"
PROJECT_VERSION="0.8"

# Root managers this kernel supports (see "./build.sh --help").
ROOT_SUPPORTED="none ksun sukisu"
# Root managers that can be combined with SUSFS.
SUSFS_SUPPORTED="sukisu"
