name: Build Wonderful Kernel

# Manual runs build every variant from the chosen branch and upload them as
# workflow artifacts. Pushing a tag like v0.8 also publishes a GitHub release
# with fixed file names, which the install guide on the website links to:
#   Wonderful-<device>-<variant>.zip

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: Vanilla,             args: "" }
          - { variant: KernelSU-Next,       args: "--root ksun" }
          - { variant: KernelSU-Next-SUSFS, args: "--root ksun --susfs" }
          - { variant: SukiSU,              args: "--root sukisu" }
          - { variant: SukiSU-SUSFS,        args: "--root sukisu --susfs" }
          - { variant: BakaSU,              args: "--root bakasu" }
          - { variant: BakaSU-SUSFS,        args: "--root bakasu --susfs" }

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex cpio lz4 zip libssl-dev libelf-dev

      - name: Cache Android clang
        uses: actions/cache@v4
        with:
          path: ~/.cache/wonderful/toolchains
          key: toolchain-clang-r416183b1

      - name: Build ${{ matrix.variant }}
        env:
          KBUILD_BUILD_USER: wonderful
          KBUILD_BUILD_HOST: github-actions
        run: ./build.sh ${{ matrix.args }}

      - name: Name release file
        run: |
          . wonderful/device.conf
          mkdir release
          cp dist/*.zip "release/Wonderful-${DEVICE}-${{ matrix.variant }}.zip"
          cp dist/*.txt "release/Wonderful-${DEVICE}-${{ matrix.variant }}.txt"
          cp out/.config "release/Wonderful-${DEVICE}-${{ matrix.variant }}.config"

      - uses: actions/upload-artifact@v4
        with:
          name: Wonderful-${{ matrix.variant }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Wonderful Kernel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.txt
